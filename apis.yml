aid: nusano
name: Nusano
description: 'Nusano is a privately held physics company headquartered in West Valley City, Utah, that
  is rebuilding radioisotope production around a proprietary high-current ion source and linear accelerator
  platform. Founded by nuclear cardiologist Dr. Howard Lewin and nuclear physicist Dr. Glenn Rosenthal
  and led by CEO Chris Lowe, the company cut the ribbon in August 2025 on a custom-built 190,000-square-foot
  production facility capable of producing more than 40 different radioisotopes, and has raised over $115M
  in a Series C to commercialize them. Its platform can generate up to twelve isotopes simultaneously
  and serves three markets: medical radioisotopes as active pharmaceutical ingredients for radiotherapeutic
  and diagnostic oncology (with multi-isotope supply agreements signed with Ratio Therapeutics, Ariceum
  Therapeutics and Clarity Pharmaceuticals), high-assay low-enriched uranium (HALEU) for next-generation
  nuclear fuel, and long-lived radioisotope nuclear batteries for aerospace, maritime and terrestrial
  use, alongside mass-separation work on North American critical mineral refining. Nusano is a manufacturer
  of physical radioisotope products, not a software vendor: it operates no developer program, publishes
  no product API, SDK or developer portal, and the only machine-readable surfaces on nusano.com are a
  published llms.txt and the WordPress content REST API (wp/v2) that serves the newsroom, Nu Blog, pages
  and media library as JSON, plus a WordPress MCP Adapter endpoint that is live but authentication-gated.'
