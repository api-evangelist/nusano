description: 'The nusano.com WordPress REST route index advertises an "mcp" namespace with a single MCP
  server route at /wp-json/mcp/mcp-adapter-default-server accepting POST, GET and DELETE. This is the
  WordPress MCP Adapter plugin surface, not a bespoke Nusano server. The endpoint is live but authentication-gated:
  an anonymous JSON-RPC tools/list and initialize both return HTTP 401 with the WordPress envelope {"code":"rest_forbidden"},
  as does the companion wp-abilities/v1 abilities registry. The published tool set therefore could NOT
  be enumerated and no tool list is recorded here — enumerating it requires authenticated introspection
  with WordPress Application Password credentials that only Nusano can issue.'
