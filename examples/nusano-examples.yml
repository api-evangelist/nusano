        internally as “Beam on Target,” the accomplishment is the first of three milestones en route to
        bringing the company’s radioisotope production platform online by the end of 2026. The Beam on
        Target milestone confirms key front-end accelerator systems, demonstrating the linear accelerator-based
        platform’s ability to generate, shape and deliver a particle beam to a defined endpoint. During
        the trial, particles reached 28% of the platform’s full energy. &nbsp; Upcoming milestones Two
        final demonstrations are planned in 2026 to validate the full Nusano system: September 2026 –
        Nusano will send a beam through its full LINAC to a target, demonstrating an initial radioisotope
        production capability. December 2026 – Nusano will send a beam through the LINAC and use magnets
        to steer accelerated particles to a target in a target bay, validating the full production platform.
