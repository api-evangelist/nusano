x-method: generated
x-source: openapi/*.yml in this repo
x-extends:
- openapi/nusano-categories-api-openapi.yml
- openapi/nusano-comments-api-openapi.yml
- openapi/nusano-discovery-api-openapi.yml
- openapi/nusano-media-api-openapi.yml
